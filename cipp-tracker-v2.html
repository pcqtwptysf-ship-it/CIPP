  saveStateDebounced();
  render();
}

function customerGateApproval(gateId, action, note) {
  if (!state.customer) state.customer = defaultCustomerState();
  state.customer.approvals[gateId] = action;
  if (note) state.customer.decisionNotes[gateId] = note;
  saveStateDebounced();
  render();
  const labels = { approved:'Freigegeben', escalated:'Eskaliert', deferred:'Zurückgestellt', change:'Änderung angefordert' };
  toast(labels[action] || 'Entscheidung gespeichert.', action === 'approved' ? 'pink' : '');
}

function buildDecisionQueue() {
  if (!state.customer) state.customer = defaultCustomerState();
  const q = [];
  const cf = state.customer.confirmations;
  if (isActivePhase() && !onboardingComplete()) {
    if (!cf.zielbild) q.push({ id:'onboard-zielbild', type:'onboard', urgent:false, title:'Zielbild bestätigen', desc:'Bitte prüfen Sie das vorbereitete PoC-Zielbild und bestätigen Sie die Richtung.' });
    if (!cf.kontakte) q.push({ id:'onboard-kontakte', type:'onboard', urgent:false, title:'Ansprechpartner bestätigen', desc:'Sponsor, Owner und NXTGN-Kontakte stimmen?' });
    if (!cf.termine) q.push({ id:'onboard-termine', type:'onboard', urgent:false, title:'Termine & Ressourcen bestätigen', desc:'Weekly-Rhythmus und Steuerkreis realistisch?' });
  }
  ['entry','g0','g1','g2','g3','g4'].forEach(gid => {
    if (isMussComplete(gid) && !state.customer.approvals[gid]) {
      const g = GATES.find(x => x.id === gid);
      q.push({ id:'gate-'+gid, type:'gate', gateId:gid, urgent:gid==='g3', title:`${g.code} bereit zur Freigabe`, desc:`Alle Muss-Kriterien in ${g.name} erfüllt — Ihre Freigabe wird benötigt.` });
    }
  });
  GATES.forEach(g => {
    (state.gates[g.id].muss || []).filter(it => it.status === 'escalated').forEach(it => {
      q.push({ id:`esc-${g.id}-${it.id}`, type:'escalation', gateId:g.id, itemId:it.id, urgent:true, title:`Eskalation: ${g.code}`, desc: it.text });
    });
  });
  if (isMussComplete('g4') && !state.customer.approvals.g5) {
    q.push({ id:'gate-g5', type:'g5', gateId:'g5', urgent:true, title:'G5 · Go / Stop / Conditional Go', desc:'Feldtest abgeschlossen — finale Entscheidung über Weiterführung erforderlich.' });
  }
  return q;
}

function generateMeetingDelta(meetingId) {
  const focus = getCurrentFocusGate();
  const fg = GATES.find(x => x.id === focus);
  const lines = [
    `Projekt: ${state.meta.name || '—'} · Fortschritt ${overallProgress()}% (Δ seit letztem ${MEETING_FLOW.find(m=>m.id===meetingId)?.label || 'Termin'})`,
    `Fokus-Gate: ${fg ? fg.code + ' · ' + fg.name : '—'} (${gateProgress(focus)}%)`,
    `Offene Muss-Kriterien: ${getOpenMussCount()} · Eskalationen: ${getEscalatedCount()} · Risiko: ${computeRiskAmpel()}`
  ];
  if (isActivePhase()) {
    const startupOpen = buildStartupDeliverables().filter(d => d.status === 'open' || d.status === 'progress').length;
    if (startupOpen) lines.push(`Startup-Lieferungen offen: ${startupOpen}`);
    const pendingSub = buildStartupDeliverables().filter(d => d.status === 'submitted').length;
    if (pendingSub) lines.push(`Startup zur Bestätigung: ${pendingSub}`);
  }
  return lines;
}

function generateGateReadiness(gateId) {
  const g = GATES.find(x => x.id === gateId);
  if (!g) return null;
  const muss = state.gates[gateId].muss || [];
  const mussDone = muss.filter(isMussItemComplete).length;
  const mussTotal = muss.length;
  const mussPct = mussTotal ? Math.round((mussDone / mussTotal) * 100) : 100;
  const openMuss = muss.filter(x => !isMussItemComplete(x));
  const escalated = muss.filter(x => x.status === 'escalated');
  const locked = isGateLocked(gateId);
  const methods = (g.methoden || []).filter(m => isMethodEnabled(m.slug));
  const methodsFilled = methods.filter(m => methodHasData((state.gates[gateId].methods || {})[m.slug], METHOD_TEMPLATES[m.slug] || {}));
  const methodPct = methods.length ? Math.round((methodsFilled.length / methods.length) * 100) : 100;
  const artifacts = PFLICHT_ARTEFAKTE.filter(a => a.gate === gateId);
  const artifactsOk = artifacts.filter(a => methodHasData((state.gates[a.gate].methods || {})[a.slug], METHOD_TEMPLATES[a.slug]));
  const artPct = artifacts.length ? Math.round((artifactsOk.length / artifacts.length) * 100) : 100;
  const score = locked ? 0 : Math.round(mussPct * 0.55 + methodPct * 0.25 + artPct * 0.2);
  const ready = !locked && mussPct === 100 && escalated.length === 0 && openMuss.length === 0 && (artifacts.length === 0 || artifactsOk.length === artifacts.length);
  const ampel = locked ? 'red' : ready ? 'green' : score >= 75 ? 'yellow' : 'red';
  let recommendation = ready ? 'Freigabe empfohlen — alle Muss-Kriterien und Pflichtartefakte erfüllt.' :
    locked ? `Gate gesperrt — Voraussetzungen aus vorherigen Gates noch nicht erfüllt.` :
    escalated.length ? `Noch nicht bereit — ${escalated.length} eskalierte Punkt(e) brauchen Entscheidung.` :
    openMuss.length ? `In Arbeit — ${openMuss.length} Muss-Kriterien offen.` :
    artifactsOk.length < artifacts.length ? `Artefakte vervollständigen — ${artifacts.length - artifactsOk.length} Pflichtartefakt(e) offen.` :
    'Fast bereit — letzte Evidenz prüfen.';
  const missingArtifacts = artifacts.filter(a => !methodHasData((state.gates[a.gate].methods || {})[a.slug], METHOD_TEMPLATES[a.slug])).map(a => a.label);
  const missingMethods = methods.filter(m => !methodHasData((state.gates[gateId].methods || {})[m.slug], METHOD_TEMPLATES[m.slug] || {})).slice(0, 5).map(m => m.name);
  const protocolLines = [
    `Gate-Review · ${g.code} · ${g.name}`,
    `Datum: ${new Date().toLocaleDateString('de-DE')}`,
    `Readiness-Score: ${score}% · Muss ${mussDone}/${mussTotal} · Methoden ${methodsFilled.length}/${methods.length}`,
    `Empfehlung: ${recommendation}`,
    openMuss.length ? `\nOffene Muss-Kriterien:\n${openMuss.map(x => '• ' + x.text).join('\n')}` : '',
    missingArtifacts.length ? `\nFehlende Artefakte:\n${missingArtifacts.map(x => '• ' + x).join('\n')}` : '',
    escalated.length ? `\nEskalationen:\n${escalated.map(x => '• ' + x.text).join('\n')}` : ''
  ].filter(Boolean);
  return {
    gateId, gateCode: g.code, gateName: g.name, ready, score, ampel, locked,
    mussDone, mussTotal, mussPct, methodPct, artPct,
    openMuss, escalated, missingArtifacts, missingMethods, recommendation,
    protocolDraft: protocolLines.join('\n')
  };
}

function generateG5Draft() {
  const canvas = (state.gates.g0.methods || {})['poc-canvas'] || {};
  const primaryKpi = canvas['kpi-primaer'] || 'Primäre KPI';
  const g5Question = canvas.erfolg || canvas.zielbild || 'Ist eine Weiterführung des PoC sinnvoll und risikoarm?';
  const zielbild = canvas.zielbild || state.meta.name || 'PoC';
  const kpiRows = (state.gates.g4.methods || {})['kpi-tracking']?.__rows || [];
  const thresholds = (state.gates.g2.methods || {})['success-threshold']?.__rows || [];
  const g5Kpis = state.gates.g5.kpis || [];
  const escalated = [
    ...getCriticalOpenMuss(),
    ...GATES.flatMap(g => (state.gates[g.id].muss || []).filter(x => x.status === 'escalated').map(x => ({ code: g.code, text: x.text })))
  ];
  const startupConfirmed = buildStartupDeliverables().filter(d => d.status === 'confirmed').length;
  const startupTotal = buildStartupDeliverables().length;
  const kpiComparison = [];
  const thresholdMap = {};
  thresholds.forEach(r => { if (r.kpi) thresholdMap[r.kpi.toLowerCase()] = r; });
  if (kpiRows.length) {
    kpiRows.forEach(r => {
      const th = thresholdMap[(r.kpi || '').toLowerCase()] || {};
      const ist = parseFloat(String(r.ist || '').replace(',', '.'));
      const ziel = parseFloat(String(r.ziel || th.go || '').replace(',', '.'));
      let status = 'offen';
      if (!isNaN(ist) && !isNaN(ziel)) status = ist >= ziel ? 'go' : ist >= ziel * 0.8 ? 'bedingt' : 'stop';
      kpiComparison.push({ kpi: r.kpi || primaryKpi, ist: r.ist || '—', ziel: r.ziel || th.go || '—', go: th.go || '—', stop: th.stop || '—', status });
    });
  } else if (g5Kpis.length) {
    g5Kpis.forEach(k => {
      kpiComparison.push({ kpi: k.text, ist: k.done ? 'erfüllt' : 'offen', ziel: 'Muss', go: '—', stop: '—', status: k.done ? 'go' : 'offen' });
    });
  } else {
    kpiComparison.push({ kpi: primaryKpi, ist: '—', ziel: '—', go: '—', stop: '—', status: 'offen' });
  }
  const goCount = kpiComparison.filter(k => k.status === 'go').length;
  const stopCount = kpiComparison.filter(k => k.status === 'stop').length;
  let recommendation = 'Go unter Bedingungen';
  let ampel = 'yellow';
  if (goCount > 0 && stopCount === 0 && getEscalatedCount() === 0 && isMussComplete('g4')) {
    recommendation = 'Go — KPIs und Feldtest sprechen für Weiterführung.';
    ampel = 'green';
  } else if (stopCount > 0 || getEscalatedCount() > 2) {
    recommendation = 'Stop — kritische KPIs oder Eskalationen sprechen gegen unbedingten Go.';
    ampel = 'red';
  }
  const executiveSummary = [
    `PoC „${state.meta.name || '—'}“ für ${state.meta.customer || 'Kunde'} — Entscheidungsvorlage G5`,
    ``,
    `Zielbild: ${(zielbild || '').slice(0, 200)}${(zielbild||'').length > 200 ? '…' : ''}`,
    `G5-Frage: ${g5Question}`,
    ``,
    `Ergebnis: Gesamtfortschritt ${overallProgress()}% · G4 ${isMussComplete('g4') ? 'abgeschlossen' : 'offen'} · Startup-Lieferungen ${startupConfirmed}/${startupTotal} bestätigt.`,
    `KPI-Bild: ${goCount} im Ziel · ${stopCount} unter Schwelle · ${getEscalatedCount()} Eskalation(en).`,
    ``,
    `Empfehlung NXTGN: ${recommendation}`,
    escalated.length ? `\nRestrisiken:\n${escalated.slice(0, 5).map(x => '• [' + x.code + '] ' + x.text).join('\n')}` : ''
  ].join('\n');
  const options = {
    go: 'Weiterführung / Skalierung — KPIs und Evidenz tragen die Hypothese.',
    conditional: 'Pilot verlängern oder eingeschränkter Rollout unter klaren Bedingungen.',
    stop: 'Beenden oder Pivot — Nutzenhypothese nicht ausreichend belegt.'
  };
  return { executiveSummary, g5Question, primaryKpi, kpiComparison, escalated, recommendation, ampel, options, fullDraft: executiveSummary };
}

function generateMeetingPack(meetingId) {
  const mf = MEETING_FLOW.find(x => x.id === meetingId) || MEETING_FLOW[0];
  const delta = generateMeetingDelta(meetingId);
  const agenda = [];
  const nextActions = [];
  const focus = getCurrentFocusGate();
  if (meetingId === 'weekly') {
    agenda.push('1. Ampel & Gesamtstatus (Cockpit Zone 1)');
    agenda.push('2. Offene Muss-Kriterien & Blocker (Zone 4)');
    getCriticalOpenMuss().slice(0, 5).forEach((x, i) => agenda.push(`   ${i + 1}. ${x.code}: ${x.text.slice(0, 55)}${x.text.length > 55 ? '…' : ''}`));
    agenda.push('3. Delivery-Fluss & nächste Schritte (Zone 6)');
    const action = getTunnelNextAction();
    agenda.push(`   → Fokus: ${action.gate ? action.gate.code : ''} — ${action.text.slice(0, 60)}`);
    agenda.push('4. RAID & Changes (Zone 7)');
    if (getEscalatedCount()) agenda.push(`   → ${getEscalatedCount()} Eskalation(en) klären`);
    buildStartupDeliverables().filter(d => d.status === 'submitted').slice(0, 2).forEach(d => agenda.push(`5. Startup-Einreichung prüfen: ${d.label}`));
    nextActions.push(getTunnelNextAction().text);
    buildDecisionQueue().slice(0, 2).forEach(d => nextActions.push(d.title));
  } else if (meetingId === 'gateReview') {
    const readiness = generateGateReadiness(focus);
    agenda.push(`1. Gate-Readiness ${readiness.gateCode}: Score ${readiness.score}% (${readiness.ampel})`);
    agenda.push(`2. ${readiness.recommendation}`);
    readiness.openMuss.slice(0, 4).forEach(x => agenda.push(`   • Offen: ${x.text.slice(0, 50)}`));
    readiness.missingArtifacts.forEach(a => agenda.push(`   • Artefakt fehlt: ${a}`));
    agenda.push('3. Freigabe dokumentieren / Entscheidung Kunde');
    buildDecisionQueue().filter(d => d.type === 'gate').forEach(d => nextActions.push(d.title));
  } else if (meetingId === 'reviewPoint') {
    agenda.push('1. Qualität Pflichtartefakte');
    PFLICHT_ARTEFAKTE.forEach(a => {
      const ok = methodHasData((state.gates[a.gate].methods || {})[a.slug], METHOD_TEMPLATES[a.slug]);
      agenda.push(`   ${ok ? '✓' : '○'} ${a.label} (${a.gate.toUpperCase()})`);
    });
    agenda.push('2. Performance / EVM-light prüfen');
    agenda.push(`3. Fortschritt parallele Stränge: G0 ${gateProgress('g0')}% · G1 ${gateProgress('g1')}% · G2 ${gateProgress('g2')}%`);
    nextActions.push('Artefakt-Lücken schließen');
  } else if (meetingId === 'retro') {
    agenda.push('1. Was lief gut / was blockierte?');
    agenda.push('2. Learnings für Case Card / Portfolio');
    agenda.push('3. Annahmen-Updates (Begleitlogik)');
    const caseOk = methodHasData((state.gates.g5.methods || {})['case-card'], METHOD_TEMPLATES['case-card']);
    agenda.push(`4. Case Card: ${caseOk ? 'gepflegt' : 'noch anlegen'}`);
    nextActions.push('Case Card aktualisieren');
  }
  mf.checks.forEach(c => { if (!agenda.some(a => a.includes(c.slice(0, 15)))) agenda.push('• ' + c); });
  const protocolDraft = [
    `${mf.label} · ${state.meta.name || 'PoC'} · ${new Date().toLocaleDateString('de-DE')}`,
    `Teilnehmer: ${(state.org || {}).nxtgnPm || 'NXTGN PM'}, ${state.meta.owner || 'Owner'}, ${state.meta.lead || 'Startup-Lead'}`,
    '',
    '--- STATUS ---',
    ...delta.map(l => '• ' + l),
    '',
    '--- AGENDA ---',
    ...agenda.map(a => a.startsWith(' ') || a.match(/^\d/) ? a : '• ' + a),
    '',
    '--- BESCHLÜSSE ---',
    '(automatisch vorbereitet — im Termin ergänzen)',
    '',
    '--- NÄCHSTE SCHRITTE ---',
    ...nextActions.map(a => '→ ' + a)
  ].join('\n');
  return { meetingId, label: mf.label, delta, agenda, nextActions, protocolDraft };
}

function buildMeetingAgenda(meetingId) {
  return generateMeetingPack(meetingId).agenda;
}

function getDeliverableFillStatus(gateId, slug) {
  const tpl = METHOD_TEMPLATES[slug];
  const data = (state.gates[gateId].methods || {})[slug];
  if (!tpl) return 'open';
  if (methodHasData(data, tpl)) return 'ready';
  if (data && (tpl.fields && tpl.fields.some(f => data[f.key] && String(data[f.key]).trim()) ||
      (tpl.table && data.__rows && data.__rows.some(r => Object.values(r).some(v => v && String(v).trim()))))) return 'progress';
  return 'open';
}

function buildStartupDeliverables() {
  if (!state.startup) state.startup = defaultStartupState();
  return STARTUP_DELIVERABLES.filter(d => isMethodEnabled(d.slug)).map(d => {
    const locked = isGateLocked(d.gate);
    const sub = state.startup.submissions[d.id] || { status:'open', note:'' };
    let status = sub.status || 'open';
    if (locked) status = 'locked';
    else if (status !== 'submitted' && status !== 'confirmed') {
      const fill = getDeliverableFillStatus(d.gate, d.slug);
      if (fill === 'ready') status = sub.status === 'submitted' || sub.status === 'confirmed' ? sub.status : 'ready';
      else if (fill === 'progress') status = 'progress';
      else status = 'open';
    }
    const g = GATES.find(x => x.id === d.gate);
    return { ...d, status, submission: sub, locked, gateCode: g ? g.code : d.gate, urgent: !locked && (status === 'open' || status === 'progress') && isActivePhase() };
  });
}

function submitStartupDeliverable(deliverableId) {
  if (!state.startup) state.startup = defaultStartupState();
  const d = STARTUP_DELIVERABLES.find(x => x.id === deliverableId);
  if (!d) return;
  const fill = getDeliverableFillStatus(d.gate, d.slug);
  if (fill !== 'ready' && fill !== 'progress') {
    toast('Bitte zuerst das Artefakt ausfüllen, dann einreichen.');
    openStartupDeliverable(d.gate, d.slug);
    return;
  }
  state.startup.submissions[deliverableId] = {
    status: 'submitted',
    note: state.startup.submissions[deliverableId]?.note || '',
    updated: new Date().toISOString()
  };
  saveStateDebounced();
  render();
  toast('Lieferung eingereicht — NXTGN prüft und bestätigt.', 'pink');
}

function setStartupDeliverableNote(deliverableId, note) {
  if (!state.startup) state.startup = defaultStartupState();
  if (!state.startup.submissions[deliverableId]) state.startup.submissions[deliverableId] = { status:'open', note:'' };
  state.startup.submissions[deliverableId].note = note;
  saveStateDebounced();
}

function openStartupDeliverable(gateId, slug) {
  if (isGateLocked(gateId)) { toast('Gate noch gesperrt — Fokus auf aktuelle Phase.'); return; }
  activeGateId = gateId;
  activeView = 'gate';
  openedMethods.add(`${gateId}:${slug}`);
  saveStateDebounced();
  render();
  setTimeout(() => {
    const el = document.querySelector(`[data-method="${slug}"]`);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 80);
}

function isStartupEditableMethod(gateId, slug) {
  if (!isStartupView()) return false;
  return STARTUP_DELIVERABLES.some(d => d.gate === gateId && d.slug === slug && isMethodEnabled(d.slug));
}

function onMeetingNotes(meetingId, val) {
  if (!state.customer) state.customer = defaultCustomerState();
  if (!state.customer.meetingNotes) state.customer.meetingNotes = {};

  if (isAdminView()) {
    if (!state.nxtgn) state.nxtgn = defaultNxtgnState();
    state.nxtgn.meetingNotes[meetingId] = val;

  saveStateDebounced();
}

    </div>
    <div class="nav-section">
      <div class="nav-section-label">Gates &amp; Tunnel</div>

function renderPanel() {
  const g = GATES.find(x => x.id === activeGateId);
  const panel = document.getElementById('gate-panel');
  panel.classList.toggle('customer-gate-readonly', isCustomerView());
  panel.classList.toggle('startup-gate', isStartupView());
  const locked = isGateLocked(g.id);
  const doneAll = isMussComplete(g.id) && gateProgress(g.id) === 100;
  const mussDone = state.gates[g.id].muss.filter(isMussItemComplete).length;
  const mussTotal = state.gates[g.id].muss.length;
  const niceDone = state.gates[g.id].nice.filter(x=>x.done).length;
  const niceTotal = state.gates[g.id].nice.length;
  const kpiDone = state.gates[g.id].kpis.filter(x=>x.done).length;
  const kpiTotal = state.gates[g.id].kpis.length;

  html += `
    <div class="sec-head">
      ${secTag('methoden')}
      <h3 class="sec-title">${isStartupView() ? 'Ihre Lieferartefakte' : 'Methoden'}${deliveryStrict || isCustomerView() ? ' · Übersicht' : ''}</h3>
      <span class="sec-hint">${filteredMethods.length} Werkzeuge · ${isCustomerView() ? 'von NXTGN gepflegt' : isStartupView() ? 'ausfüllen und einreichen' : 'klick um auszufüllen'}</span>
    </div>
    <div class="method-list">
      ${filteredMethods.length ? filteredMethods.map(m => renderMethodCard(g.id, m)).join('') : `<div class="ws-empty">${isStartupView() ? 'In diesem Gate keine Startup-Lieferung aktiv — siehe Lieferübersicht.' : 'Keine Methoden für diesen Tunnel aktiviert — NXTGN Admin konfiguriert im Setup.'}</div>`}
    </div>

    ${isParticipantView() ? '' : `
    <div class="sec-head">
      ${secTag('notes')}
      <h3 class="sec-title">Notizen &amp; Evidenzhinweise</h3>
    </div>
    <div class="notes-area">
      <textarea oninput="onNotes('${g.id}', this.value)" placeholder="Freitext für Evidenzverweise, offene Punkte, Links zu Dokumenten …">${escapeHtml(state.gates[g.id].notes||'')}</textarea>
    </div>`}
  `;
  panel.innerHTML = html;
}

function renderChecklist(gateId, type) {
  const items = state.gates[gateId][type];
  const cls = type === 'nice' ? 'nice' : '';
  const strict = isCustomerView();
  const isMuss = type === 'muss';
  if (!items.length) return `<div class="check-list ${cls}"><div class="ws-empty">Keine Einträge.</div></div>`;
  return `<div class="check-list ${cls}">` + items.map((it, i) => {
    normalizeMussItem(it);
    const extraCls = isMuss && it.status === 'escalated' ? ' escalated' : isMuss && it.status === 'progress' ? ' in-progress' : '';
    const statusChip = isMuss ? `<span class="status-chip ${it.status}">${MUSS_STATUS.find(s=>s.id===it.status)?.label||it.status}</span>` : '';
    return `
    <div class="check-item ${it.done?'checked':''}${extraCls}" data-id="${it.id}">
      ${strict ? `<div class="check-box-wrap"><div class="check-box"></div></div>` : `<div class="check-box-wrap" onclick="toggleItem('${gateId}','${type}','${it.id}')"><div class="check-box"></div></div>`}
      <div class="check-label" id="lbl-${gateId}-${type}-${it.id}" ${strict ? '' : `onclick="toggleItem('${gateId}','${type}','${it.id}')"`}
           ondblclick="${strict || !isMuss?'':'startEditLabel(event,\''+gateId+'\',\''+type+'\',\''+it.id+'\')'}">${escapeHtml(it.text)}</div>
      ${isMuss ? (strict ? statusChip : `<select class="muss-status-select" onclick="event.stopPropagation()" onchange="setMussStatus('${gateId}','${type}','${it.id}', this.value)">${MUSS_STATUS.map(s=>`<option value="${s.id}" ${it.status===s.id?'selected':''}>${s.label}</option>`).join('')}</select>`) : ''}
      ${strict ? '' : `<div class="check-actions admin-only">
        <button class="check-action-btn" onclick="editLabelBtn(event,'${gateId}','${type}','${it.id}')" title="Bearbeiten">✎</button>
        <button class="check-action-btn del" onclick="deleteItem('${gateId}','${type}','${it.id}')" title="Löschen">×</button>
      </div>`}
    </div>`;
  }).join('') + `</div>`;
}

function renderAddRow(gateId, type) {
  const title = type === 'muss'
    ? 'Muss-Kriterium'
    : type === 'nice'
      ? 'Nice-to-have'
      : 'KPI';
  return `<div class="add-item-row">
    <input id="add-${gateId}-${type}" placeholder="Neue${title==='KPI'?'':'s'} ${title} eingeben und Enter drücken …" onkeydown="if(event.key==='Enter'){addItem('${gateId}','${type}')}">
    <button onclick="addItem('${gateId}','${type}')">Hinzufügen</button>
  </div>`;
}

function renderMethodCard(gateId, m) {
  const tpl = METHOD_TEMPLATES[m.slug] || {};
  const data = (state.gates[gateId].methods && state.gates[gateId].methods[m.slug]) || {};
  const hasData = methodHasData(data, tpl);
  const startupEdit = isStartupEditableMethod(gateId, m.slug);
  const isOpen = openedMethods.has(`${gateId}:${m.slug}`) || (m.slug === 'poc-canvas' && isAdminView()) || startupEdit;
  const guide = METHOD_GUIDES[m.slug] || 'Handbuch 2.0: Zweck klar benennen, Owner setzen, Evidence verlinken, im Weekly reviewen.';
  const visualBadge = isVisualMethod(m.slug) ? '<span class="method-visual-badge">VISUELL</span>' : '';
  const startupBadge = startupEdit ? '<span class="method-visual-badge" style="background:#e8f5e9;color:#2d8a3e">IHRE LIEFERUNG</span>' : '';
  return `
    <div class="method ${isOpen?'open':''}${isVisualMethod(m.slug)?' method-is-visual':''}${startupEdit?' startup-editable':''}" data-method="${m.slug}">
      <div class="method-head" onclick="toggleMethod('${gateId}','${m.slug}')">
        <span class="method-name">${escapeHtml(m.name)}${visualBadge}${startupBadge}</span>
        <span class="method-meta ${hasData?'has-data':''}">${hasData?'● ausgefüllt':''}</span>
        <span class="method-toggle">${isOpen?'Zuklappen':'Öffnen'}</span>
      </div>
      <div class="method-body">
        <div class="method-guide"><strong>So ausfüllen (Handbuch 2.0):</strong> ${escapeHtml(guide)}</div>
        ${!isVisualMethod(m.slug) ? `<div class="method-desc">${escapeHtml(m.desc)}</div>` : ''}
        ${renderMethodWorksheet(gateId, m.slug)}
      </div>
    </div>`;
}

function methodHasData(data, tpl) {
  if (!data) return false;
  if (tpl.fields) { for (const f of tpl.fields) if (data[f.key] && String(data[f.key]).trim()) return true; }
  if (tpl.table && Array.isArray(data.__rows) && data.__rows.some(r => Object.values(r).some(v => v && String(v).trim()))) return true;
  return false;
}

const VISUAL_METHOD_SLUGS = new Set([
  'poc-canvas','scope-boxing','assumption-mapping','kpi-tree','discovery-check',
  'decision-backwards-planning','success-threshold','readiness-review','messplan','baseline',
  'nda','poc-vertrag','dua-dpa','go-stop','kpi-tracking'
]);

function isVisualMethod(slug) { return VISUAL_METHOD_SLUGS.has(slug); }

function confirmStartupDeliverable(deliverableId) {
  if (!isAdminView()) { toast('Nur NXTGN Admin kann Lieferungen bestätigen.'); return; }
  if (!state.startup) state.startup = defaultStartupState();
  if (!state.startup.submissions[deliverableId]) state.startup.submissions[deliverableId] = { status:'open', note:'' };
  state.startup.submissions[deliverableId].status = 'confirmed';
  state.startup.submissions[deliverableId].updated = new Date().toISOString();
  saveStateDebounced();
  render();
  toast('Startup-Lieferung bestätigt.', 'pink');
}

function vmReadonly() { return isCustomerView(); }

function vmTextarea(gateId, slug, key, label, val, ro, extraCls='') {
  if (ro) return `<div class="vm-cell ${extraCls}"><label>${escapeHtml(label)}</label><div class="vm-ro-val">${escapeHtml(val) || '—'}</div></div>`;
  return `<div class="vm-cell ${extraCls}"><label>${escapeHtml(label)}</label><textarea oninput="onMethodField('${gateId}','${slug}','${key}', this.value)" placeholder="…">${escapeHtml(val)}</textarea></div>`;
}

function vmInput(gateId, slug, key, label, val, ro, extraCls='') {
  if (ro) return `<div class="vm-cell ${extraCls}"><label>${escapeHtml(label)}</label><div class="vm-ro-val">${escapeHtml(val) || '—'}</div></div>`;
  return `<div class="vm-cell ${extraCls}"><label>${escapeHtml(label)}</label><input value="${escapeAttr(val)}" oninput="onMethodField('${gateId}','${slug}','${key}', this.value)" placeholder="…"></div>`;
}

function ensureMethodData(gateId, slug) {
  if (!state.gates[gateId].methods) state.gates[gateId].methods = {};
  if (!state.gates[gateId].methods[slug]) state.gates[gateId].methods[slug] = {};

}

function renderVisualScopeBoxing(gateId, slug, data, ro) {
  const rows = Array.isArray(data.__rows) ? data.__rows : (data.__rows = []);
  const cols = { in: [], out: [], grey: [] };
  rows.forEach(r => {
    const s = r.status || 'In Scope';
    if (s === 'Out of Scope') cols.out.push(r);
    else if (s === 'Grauzone') cols.grey.push(r);
    else cols.in.push(r);
  });
  const renderCol = (items, type, title) => {
    const cls = type === 'in' ? 'in' : type === 'out' ? 'out' : 'grey';
    return `<div class="vm-scope-col ${cls}"><h4>${title} (${items.length})</h4>
      ${items.length ? items.map((r, i) => {
        const idx = rows.indexOf(r);
        return ro
          ? `<div class="vm-scope-item">${escapeHtml(r.thema||'—')}</div>`
          : `<div class="vm-scope-item"><input style="width:100%;border:none;background:transparent;font-family:inherit;font-size:12px" value="${escapeAttr(r.thema||'')}" oninput="onMethodRow('${gateId}','${slug}',${idx},'thema', this.value)" placeholder="Thema …"></div>`;
      }).join('') : `<div style="font-size:11px;color:var(--grey-faint)">Noch leer</div>`}
    </div>`;
  };
  const addBtns = ro ? '' : `<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn-dark btn-small" onclick="addScopeItem('${gateId}','${slug}','In Scope')">+ In Scope</button>
    <button class="btn-dark btn-small" onclick="addScopeItem('${gateId}','${slug}','Out of Scope')">+ Out</button>
    <button class="btn-dark btn-small" onclick="addScopeItem('${gateId}','${slug}','Grauzone')">+ Grauzone</button>
  </div>`;
  return `<div class="method-visual"><div class="vm-scope-map">
    ${renderCol(cols.in, 'in', 'In Scope')}
    ${renderCol(cols.out, 'out', 'Out of Scope')}
    ${cols.grey.length ? renderCol(cols.grey, 'grey', 'Grauzone') : ''}
  </div>${addBtns}</div>`;
}

function addScopeItem(gateId, slug, status) {
  const data = ensureMethodData(gateId, slug);
  if (!data.__rows) data.__rows = [];
  data.__rows.push({ thema: '', status, begruendung: '' });
  saveStateDebounced();
  openedMethods.add(`${gateId}:${slug}`);
  render();
}

function renderVisualAssumptionMapping(gateId, slug, data, ro) {
  const rows = Array.isArray(data.__rows) ? data.__rows : (data.__rows = []);
  const quads = { hh:[], hm:[], mh:[], mm:[], rest:[] };
  rows.forEach(r => {
    const w = r.wichtigkeit || 'Mittel';
    const u = r.unsicherheit || 'Mittel';
    if (w === 'Hoch' && u === 'Hoch') quads.hh.push(r);
    else if (w === 'Hoch') quads.hm.push(r);
    else if (u === 'Hoch') quads.mh.push(r);
    else if (w === 'Mittel') quads.mm.push(r);
    else quads.rest.push(r);
  });
  const quad = (items, cls, title) => `<div class="vm-matrix-quadrant ${cls}"><div style="font-size:10px;font-weight:700;margin-bottom:6px">${title}</div>
    ${items.map(r => `<span class="vm-matrix-chip">${escapeHtml((r.annahme||'').slice(0,40))}${(r.annahme||'').length>40?'…':''}</span>`).join('') || '<span style="font-size:10px;color:var(--grey-faint)">—</span>'}
  </div>`;
  const tableRows = ro ? '' : `<div class="ws-table-wrap" style="margin-top:12px"><table class="ws-table"><thead><tr><th>Annahme</th><th>Wichtigkeit</th><th>Unsicherheit</th><th>Test</th><th></th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td><textarea rows="1" oninput="onMethodRow('${gateId}','${slug}',${i},'annahme',this.value)">${escapeHtml(r.annahme||'')}</textarea></td>
      <td><select onchange="onMethodRow('${gateId}','${slug}',${i},'wichtigkeit',this.value)">${['Hoch','Mittel','Niedrig'].map(o=>`<option ${r.wichtigkeit===o?'selected':''}>${o}</option>`).join('')}</select></td>
      <td><select onchange="onMethodRow('${gateId}','${slug}',${i},'unsicherheit',this.value)">${['Hoch','Mittel','Niedrig'].map(o=>`<option ${r.unsicherheit===o?'selected':''}>${o}</option>`).join('')}</select></td>
      <td><textarea rows="1" oninput="onMethodRow('${gateId}','${slug}',${i},'test',this.value)">${escapeHtml(r.test||'')}</textarea></td>
      <td><button class="row-del" onclick="deleteMethodRow('${gateId}','${slug}',${i})">×</button></td></tr>`).join('')}
    </tbody></table><div class="ws-table-foot"><button class="btn-dark btn-small" onclick="addMethodRow('${gateId}','${slug}')">+ Annahme</button></div></div>`;
  return `<div class="method-visual">
    <div class="vm-assumption-matrix">
      <div></div><div class="vm-matrix-label">Hohe Unsicherheit</div><div class="vm-matrix-label">Niedrigere Unsicherheit</div>
      <div class="vm-matrix-label">Hohe Wichtigkeit</div>${quad(quads.hh, 'critical', 'Kritisch — sofort testen')}${quad(quads.hm, 'watch', 'Beobachten')}
      <div class="vm-matrix-label">Mittlere Wichtigkeit</div>${quad(quads.mh, 'watch', 'Validieren')}${quad(quads.mm, '', 'Geringer Fokus')}
    </div>${tableRows}</div>`;
}

function docStatusPct(status, fieldMap) {
  const s = status || '';
  const order = fieldMap || ['Nicht begonnen','In Vorbereitung','In Verhandlung','Entwurf','Zur Unterschrift','Unterschrieben','Freigegeben','Ja'];
  const idx = order.findIndex(x => s.includes(x) || s === x);
  if (s.includes('Unterschrieben') || s === 'Freigegeben' || s === 'Ja') return 100;
  if (idx < 0) return s ? 40 : 10;
  return Math.round(((idx + 1) / order.length) * 100);
}

function renderVisualG1Doc(gateId, slug, data, ro) {
  const labels = { nda:'NDA / Vertraulichkeit', 'poc-vertrag':'PoC-Vertrag / Pilotvereinbarung', 'dua-dpa':'DUA / DPA' };

  const statusField = tpl.fields.find(f => f.key === 'status') || tpl.fields.find(f => f.type === 'select');
  const statusKey = statusField ? statusField.key : 'status';
  const status = data[statusKey] || '';
  const pct = docStatusPct(status, statusField && statusField.options ? statusField.options : undefined);
  const fields = tpl.fields.filter(f => f.key !== statusKey && f.key !== 'erforderlich').slice(0, 4);
  return `<div class="method-visual vm-doc-matrix">
    <div class="vm-doc-row">
      <strong>${escapeHtml(labels[slug]||slug)}</strong>
      <div><div class="vm-doc-bar"><div class="vm-doc-bar-fill" style="width:${pct}%"></div></div></div>
      ${ro ? `<span>${escapeHtml(status||'—')}</span>` : `<select onchange="onMethodField('${gateId}','${slug}','${statusKey}', this.value)"><option value="">—</option>${(statusField?.options||[]).map(o=>`<option ${status===o?'selected':''}>${o}</option>`).join('')}</select>`}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      ${fields.map(f => {

        if (f.type==='select') return `<div><label style="font-size:10px;font-weight:600">${escapeHtml(f.label)}</label><select style="width:100%;font-size:11px" onchange="onMethodField('${gateId}','${slug}','${f.key}', this.value)"><option value="">—</option>${(f.options||[]).map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select></div>`;

function renderMethodWorksheet(gateId, slug) {
  if (isVisualMethod(slug)) return renderVisualMethod(gateId, slug);
  const tpl = METHOD_TEMPLATES[slug];
  if (!tpl) return `<div class="ws-empty">Kein Worksheet-Template hinterlegt.</div>`;
  if (!state.gates[gateId].methods) state.gates[gateId].methods = {};
  if (!state.gates[gateId].methods[slug]) state.gates[gateId].methods[slug] = {};
  const data = state.gates[gateId].methods[slug];

  let html = '';
  if (tpl.fields && tpl.fields.length) {
    const twoCol = tpl.fields.every(f => f.type === 'input' || f.type === 'select');
    html += twoCol ? `<div class="ws-grid">` : ``;
    tpl.fields.forEach(f => {
      const val = data[f.key] || '';
      if (f.type === 'select') {
        const opts = (f.options||[]).map(o => `<option value="${escapeAttr(o)}" ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('');
        html += `<div class="ws-field"><label>${escapeHtml(f.label)}</label><select onchange="onMethodField('${gateId}','${slug}','${f.key}', this.value)"><option value="">—</option>${opts}</select>${f.hint?`<div class="hint">${escapeHtml(f.hint)}</div>`:''}</div>`;
      } else if (f.type === 'input') {
        html += `<div class="ws-field"><label>${escapeHtml(f.label)}</label><input value="${escapeAttr(val)}" oninput="onMethodField('${gateId}','${slug}','${f.key}', this.value)" placeholder="${escapeAttr(f.hint||'')}">${f.hint?`<div class="hint">${escapeHtml(f.hint)}</div>`:''}</div>`;
      } else {
        html += `<div class="ws-field"${twoCol?' style="grid-column:1 / -1;"':''}><label>${escapeHtml(f.label)}</label><textarea oninput="onMethodField('${gateId}','${slug}','${f.key}', this.value)" placeholder="${escapeAttr(f.hint||'')}">${escapeHtml(val)}</textarea>${f.hint?`<div class="hint">${escapeHtml(f.hint)}</div>`:''}</div>`;
      }
    });
    html += twoCol ? `</div>` : ``;
  }
  if (tpl.table) {
    const rows = Array.isArray(data.__rows) ? data.__rows : (data.__rows = []);
    const cols = tpl.table.columns;
    html += `<div class="ws-table-wrap" style="margin-top:${tpl.fields?'14px':'0'}">
      <div class="ws-table-head-row"><span>Tabelle</span><span>${rows.length} Zeile${rows.length===1?'':'n'}</span></div>
      <table class="ws-table"><thead><tr>${cols.map(c=>`<th style="${c.width?`width:${c.width}px`:''}">${escapeHtml(c.label)}</th>`).join('')}<th style="width:40px"></th></tr></thead><tbody>`;
    if (!rows.length) {
      html += `<tr><td colspan="${cols.length+1}" class="ws-empty">Noch keine Einträge.</td></tr>`;
    } else {
      rows.forEach((row, idx) => {
        html += `<tr>`;
        cols.forEach(c => {
          const val = row[c.key] || '';
          if (c.options) {
            const opts = c.options.map(o=>`<option value="${escapeAttr(o)}" ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('');
            html += `<td><select onchange="onMethodRow('${gateId}','${slug}',${idx},'${c.key}', this.value)"><option value="">—</option>${opts}</select></td>`;
          } else {
            html += `<td><textarea rows="1" oninput="onMethodRow('${gateId}','${slug}',${idx},'${c.key}', this.value)">${escapeHtml(val)}</textarea></td>`;
          }
        });
        html += `<td><button class="row-del" onclick="deleteMethodRow('${gateId}','${slug}',${idx})" title="Zeile löschen">×</button></td>`;
        html += `</tr>`;
      });
    }
    html += `</tbody></table>
      <div class="ws-table-foot"><button class="btn-dark btn-small" onclick="addMethodRow('${gateId}','${slug}')">+ Zeile hinzufügen</button></div>
    </div>`;
  }
  return html;
}

// ============================================================
// INTERACTIONS — Checklist
// ============================================================
function toggleItem(gateId, type, itemId) {
  const it = state.gates[gateId][type].find(x => x.id === itemId);
  if (!it) return;
  if (type === 'muss') {
    it.status = isMussItemComplete(it) ? 'open' : 'done';
    normalizeMussItem(it);
  } else {
    it.done = !it.done;
  }
  saveStateDebounced();
  render();
}
function addItem(gateId, type) {
  const input = document.getElementById(`add-${gateId}-${type}`);
  const text = input.value.trim();
  if (!text) return;
  const row = { id:newId(), text, done:false };
  if (type === 'muss') row.status = 'open';
  state.gates[gateId][type].push(row);
  input.value = '';
  saveStateDebounced();
  render();
  setTimeout(()=>{ const el = document.getElementById(`add-${gateId}-${type}`); if (el) el.focus(); }, 20);
}
function focusAddInput(gateId, type) {
  const el = document.getElementById(`add-${gateId}-${type}`);
  if (el) { el.focus(); el.scrollIntoView({behavior:'smooth', block:'center'}); }
}
function deleteItem(gateId, type, itemId) {
  state.gates[gateId][type] = state.gates[gateId][type].filter(x => x.id !== itemId);
  saveStateDebounced();
  render();
}
function editLabelBtn(ev, gateId, type, itemId) {
  ev.stopPropagation();
  startEditLabel(ev, gateId, type, itemId);
}
function startEditLabel(ev, gateId, type, itemId) {
  ev.stopPropagation();
  const el = document.getElementById(`lbl-${gateId}-${type}-${itemId}`);
  if (!el) return;
  el.contentEditable = 'true';
  el.focus();
  // Select all
  const range = document.createRange(); range.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  el.onblur = () => finishEditLabel(gateId, type, itemId, el);
  el.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } if (e.key === 'Escape') { el.textContent = (state.gates[gateId][type].find(x=>x.id===itemId)||{}).text||''; el.blur(); } };
}
function finishEditLabel(gateId, type, itemId, el) {
  const it = state.gates[gateId][type].find(x => x.id === itemId);
  if (it) { it.text = el.textContent.trim() || it.text; }
  el.contentEditable = 'false'; el.onblur = null; el.onkeydown = null;
  saveStateDebounced();
  render();
}

// ============================================================
// INTERACTIONS — Methods
// ============================================================
function toggleMethod(gateId, slug) {
  const key = `${gateId}:${slug}`;
  if (openedMethods.has(key)) openedMethods.delete(key); else openedMethods.add(key);
  render();
}
function onMethodField(gateId, slug, key, val) {
  if (!state.gates[gateId].methods) state.gates[gateId].methods = {};
  if (!state.gates[gateId].methods[slug]) state.gates[gateId].methods[slug] = {};
  state.gates[gateId].methods[slug][key] = val;
  saveStateDebounced();
  // Update the "ausgefüllt" indicator without re-rendering the whole panel
  updateMethodIndicator(gateId, slug);
}
function onMethodRow(gateId, slug, idx, key, val) {
  const rows = state.gates[gateId].methods[slug].__rows;
  if (!rows[idx]) rows[idx] = {};
  rows[idx][key] = val;
  saveStateDebounced();
  updateMethodIndicator(gateId, slug);
}
function addMethodRow(gateId, slug) {
  if (!state.gates[gateId].methods[slug].__rows) state.gates[gateId].methods[slug].__rows = [];
  state.gates[gateId].methods[slug].__rows.push({});
  saveStateDebounced();
  openedMethods.add(`${gateId}:${slug}`);
  render();
}
function deleteMethodRow(gateId, slug, idx) {
  state.gates[gateId].methods[slug].__rows.splice(idx, 1);
  saveStateDebounced();
  render();
}
function updateMethodIndicator(gateId, slug) {
  const tpl = METHOD_TEMPLATES[slug];
  const data = state.gates[gateId].methods[slug];
  const has = methodHasData(data, tpl);
  const card = document.querySelector(`.method[data-method="${slug}"]`);
  if (!card) return;
  const meta = card.querySelector('.method-meta');
  if (has) { meta.classList.add('has-data'); meta.textContent = '● ausgefüllt'; }
  else { meta.classList.remove('has-data'); meta.textContent = ''; }
}

// ============================================================
// EXPORT — Markdown & JSON
// ============================================================
function buildMarkdown() {
  const m = state.meta;
  let md = `# CIPP PoC — ${m.name || '(unbenannt)'}\n\n**NXTGN · Customer Innovation PoC Process**\n\n`;
  md += `- **Kunde / Partner:** ${m.customer || '—'}\n- **Owner (Kunde):** ${m.owner || '—'}\n- **Lead (Lösung):** ${m.lead || '—'}\n- **Stand:** ${new Date().toLocaleString('de-DE')}\n- **Gesamtfortschritt:** ${overallProgress()}%\n\n`;
  md += `## Gate-Übersicht\n\n| Gate | Name | Status | Muss erfüllt |\n|---|---|---|---|\n`;
  GATES.forEach(g => {
    const locked = isGateLocked(g.id);
    const done = isMussComplete(g.id) && gateProgress(g.id) === 100;
    const status = locked ? '🔒 gesperrt' : done ? '✅ bestanden' : '◐ offen';
    const c = state.gates[g.id].muss.filter(x=>x.done).length;
    md += `| ${g.code} | ${g.name} | ${status} | ${c}/${state.gates[g.id].muss.length} |\n`;
  });
  md += `\n`;

  GATES.forEach(g => {
    md += `---\n\n## ${g.code} — ${g.name}\n\n**Ziel:** ${g.goal}\n\n`;
    md += `### Muss-Kriterien\n\n`;
    state.gates[g.id].muss.forEach(it => md += `- [${it.done?'x':' '}] ${it.text}\n`);
    md += `\n`;
    if (state.gates[g.id].nice.length) {
      md += `### Nice-to-have\n\n`;
      state.gates[g.id].nice.forEach(it => md += `- [${it.done?'x':' '}] ${it.text}\n`);
      md += `\n`;
    }
    if (state.gates[g.id].kpis.length) {
      md += `### KPI-Tracker\n\n`;
      state.gates[g.id].kpis.forEach(it => md += `- [${it.done?'x':' '}] ${it.text}\n`);
      md += `\n`;
    }
    // Methoden mit Inhalten
    const methodsWithData = g.methoden.filter(m => {
      const d = (state.gates[g.id].methods||{})[m.slug];
      return methodHasData(d, METHOD_TEMPLATES[m.slug]);
    });
    if (methodsWithData.length) {
      md += `### Methoden (ausgefüllt)\n\n`;
      methodsWithData.forEach(m => {
        const tpl = METHOD_TEMPLATES[m.slug];
        const d = state.gates[g.id].methods[m.slug];
        md += `#### ${m.name}\n\n`;
        if (tpl.fields) {
          tpl.fields.forEach(f => {
            const v = d[f.key];
            if (v && String(v).trim()) md += `- **${f.label}:** ${String(v).replace(/\n/g,' · ')}\n`;
          });
        }
        if (tpl.table && d.__rows && d.__rows.length) {
          const cols = tpl.table.columns;
          md += `\n| ${cols.map(c=>c.label).join(' | ')} |\n|${cols.map(()=>'---').join('|')}|\n`;
          d.__rows.forEach(r => {
            md += `| ${cols.map(c=>String(r[c.key]||'').replace(/\n/g,' ').replace(/\|/g,'/')).join(' | ')} |\n`;
          });
        }
        md += `\n`;
      });
    }
    // Alle verfügbaren Methoden (Liste)
    md += `### Methoden-Werkzeuge (verfügbar)\n\n`;
    g.methoden.forEach(m => md += `- **${m.name}** — ${m.desc}\n`);
    md += `\n`;
    if (state.gates[g.id].notes && state.gates[g.id].notes.trim()) md += `### Notizen\n\n${state.gates[g.id].notes}\n\n`;
  });
  md += `---\n\n*CIPP 2.0: G0–G2 parallel, G3 Konvergenz, G4 Feldtest, G5 Entscheidung. Gate nur bestanden bei vollständigen Muss-Kriterien.*\n`;
  return md;
}

function buildJSON() { return JSON.stringify(state, null, 2); }

function openExport() {
  const md = buildMarkdown();
  const json = buildJSON();
  document.getElementById('modal-title').textContent = 'Export · Markdown & JSON';
  document.getElementById('modal-body-container').innerHTML = `

    <p>Zum Lesen, Kommentieren, in Dokumente einfügen.</p>

    <h4 style="margin-top:22px;">JSON-Export (für die Zusammenarbeit)</h4>
    <p><strong>Dies ist das Format zum Teilen.</strong> Lege die JSON-Datei in OneDrive ab — deine Kollegin kann sie dann per <em>Import</em> in diese App laden, weiterbearbeiten und wieder exportieren.</p>
    <pre id="export-json" style="max-height:200px; overflow:auto;">${escapeHtml(json)}</pre>
  `;
  document.getElementById('modal-foot').innerHTML = `

    <button class="btn-dark" onclick="downloadExport('md')">MD herunterladen</button>

}

async function copyExport(type) {
  const text = type === 'md' ? document.getElementById('export-md').textContent : document.getElementById('export-json').textContent;
  try { await navigator.clipboard.writeText(text); toast('In Zwischenablage kopiert.', 'pink'); }
  catch (e) { toast('Kopieren fehlgeschlagen.'); }
}
function downloadExport(type) {
  const text = type === 'md' ? buildMarkdown() : buildJSON();
  const safe = (state.meta.name || 'cipp-poc').replace(/[^a-z0-9-_]+/gi,'_').toLowerCase();
  const ext = type === 'md' ? 'md' : 'json';
  const mime = type === 'md' ? 'text/markdown' : 'application/json';
  const blob = new Blob([text], { type: `${mime};charset=utf-8` });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${safe}_cipp_${new Date().toISOString().slice(0,10)}.${ext}`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast((type==='md'?'Markdown':'JSON')+' heruntergeladen.', 'pink');
}

function importJson() {
  document.getElementById('import-input').click();
}
document.getElementById('import-input').addEventListener('change', function(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed || typeof parsed !== 'object' || !parsed.gates) throw new Error('Unbekanntes Format');
      if (!confirm('Importierten Stand übernehmen? Der aktuelle Stand wird ersetzt.')) return;
      state = migrate(parsed);
      fillMetaInputs();
      activeGateId = 'entry';
      activeView = 'cockpit';
      render();
      saveState(false);
      toast('Import erfolgreich.', 'pink');
    } catch (e) {
      toast('Import fehlgeschlagen: ' + (e.message || 'Ungültiges JSON'));
    }
  };
  r.readAsText(file);
  ev.target.value = '';
});

function escapeAttr(s) { return escapeHtml(s); }
let toastTimer = null;

}
